name: Continuous Integration

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: Lint, Type Check, and Test
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi

      - name: Run Ruff (Linter & Import Check)
        run: |
          ruff check .

      - name: Run Black (Formatting Check)
        run: |
          black --check .

      - name: Run MyPy (Static Type Check)
        run: |
          mypy framework network run.py

      - name: Run Pytest & Generate Coverage Report
        run: |
          pytest --cov=framework --cov=network --cov-report=html:htmlcov --cov-report=term-missing
